<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - VoiceForge</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="margin-top: 60px;">
        <div class="header">
            <a href="/">
                <img src="/images/logo.svg" alt="VoiceForge Logo" class="logo">
            </a>
            <h1>Send Feedback</h1>
            <p class="subtitle">Help us improve VoiceForge</p>
        </div>
        
        <form id="feedbackForm" class="auth-form">
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="Brief description of your feedback" required>
            </div>
            
            <div class="form-group">
                <label for="message">Your Feedback</label>
                <textarea id="message" name="message" placeholder="Tell us what you think..." required style="min-height: 120px;"></textarea>
            </div>
            
            <button type="submit" class="convert-btn">[SEND] Send Feedback</button>
        </form>
        
        <div id="error" class="error hidden"></div>
        <div id="success" class="success hidden"></div>
    </div>
    
    <script>
        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            // Show loader
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Please wait...';
            
            try {
                const response = await fetch('/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    successDiv.textContent = 'Thank you! Your feedback has been sent successfully.';
                    successDiv.classList.remove('hidden');
                    errorDiv.classList.add('hidden');
                    e.target.reset();
                } else {
                    errorDiv.textContent = result.error;
                    errorDiv.classList.remove('hidden');
                    successDiv.classList.add('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Failed to send feedback. Please try again.';
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
            } finally {
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '[SEND] Send Feedback';
            }
        });
    </script>
</body>
</html>
