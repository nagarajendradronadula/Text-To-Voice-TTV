<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - VoiceForge</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">
                <img src="/images/logo.svg" alt="VoiceForge Logo" class="nav-logo">
            </a>
            <span class="nav-title">VoiceForge</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/history" class="nav-link active">History</a>
            <a href="/profile" class="nav-link">Profile</a>
        </div>
    </nav>
    
    <div class="main-content">
        <div class="container">
        <div class="header">
            <h1>Generation History</h1>
            <p class="subtitle">Your text-to-speech conversion history</p>
        </div>
        
        <div id="historyList" class="history-list">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your history...</p>
            </div>
        </div>
        </div>
    </div>
    
    <script>
        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const history = await response.json();
                
                const historyList = document.getElementById('historyList');
                
                if (history.length === 0) {
                    historyList.innerHTML = '<div class="no-history">No generation history yet. Start creating some audio!</div>';
                    return;
                }
                
                historyList.innerHTML = history.map(item => `
                    <div class="history-item" data-id="${item._id}">
                        <div class="history-content">
                            <div class="history-text">${item.text.substring(0, 100)}${item.text.length > 100 ? '...' : ''}</div>
                            <div class="history-meta">
                                <span class="voice-info">Voice: ${item.voice}</span>
                                <span class="speed-info">Speed: ${item.speed}</span>
                                <span class="date-info">${new Date(item.createdAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                        <div class="history-actions">
                            <audio controls src="${item.audioUrl}"></audio>
                            <button class="delete-btn" onclick="deleteHistory('${item._id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('historyList').innerHTML = '<div class="error">Failed to load history</div>';
            }
        }
        
        async function deleteHistory(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            
            try {
                await fetch(`/api/history/${id}`, { method: 'DELETE' });
                document.querySelector(`[data-id="${id}"]`).remove();
            } catch (error) {
                alert('Failed to delete item');
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
